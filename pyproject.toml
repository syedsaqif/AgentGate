[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.1.0"
description = "AgentGate hackathon monorepo bootstrap"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "greenlet>=3.5.6",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rfc8785>=0.1,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_sdk", "bank_mock", "contracts", "gateway", "simulator", "tools"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "scaffold: initialization checks that do not claim feature completeness",
  "contract: shared boundary and fixture checks",
  "integration: all-real integration checks (not implemented at bootstrap)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["TEAM_TASK_DISTRIBUTION (28).md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contracts"]

[tool.uv]
required-version = ">=0.13.7,<0.14"
