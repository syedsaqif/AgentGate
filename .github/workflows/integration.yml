name: Integration gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m tools.dev check-contracts
      - run: uv run python -m tools.verify_vectors
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run mypy

  frontend-and-real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_GATEWAY_ORIGIN: http://127.0.0.1:8000
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:real
