name: Track D scaffold

on:
  pull_request:
    paths:
      - "contracts/openapi.json"
      - "contracts/http/a.yaml"
      - "contracts/http/b.yaml"
      - "contracts/common.py"
      - "contracts/core_models.py"
      - "contracts/identity_models.py"
      - "contracts/reason_codes.py"
      - "contracts/fixtures/a/**"
      - "contracts/fixtures/b/**"
      - "contracts/fixtures/d/**"
      - "frontend/**"
      - "docs/d/**"
      - "docs/DEMO.md"
      - "docs/TEST_RUN.md"
      - "README.md"
      - ".github/workflows/d.yml"

permissions:
  contents: read

jobs:
  scaffold-d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
